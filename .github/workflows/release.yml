name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure
        run: cmake --preset windows-vs2022-x64

      - name: Build Release
        run: cmake --build --preset windows-vs2022-x64-release --parallel

      - name: Run Release tests
        run: ctest --preset windows-vs2022-x64-release

      - name: Package executable and generate SHA-256 checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $configurationDir = Join-Path $env:GITHUB_WORKSPACE 'out/build/windows-vs2022-x64/Release'
          $packageScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/package-release.ps1'
          & $packageScript -ConfigurationDirectory $configurationDir -ReleaseTag $env:RELEASE_TAG -OutputDirectory $env:GITHUB_WORKSPACE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ComTrace-${{ inputs.tag || github.ref_name }}-win-x64.zip
            ComTrace.exe
            ComTraceArchive.exe
            ComTraceOleActivityFixture.exe
            SHA256SUMS.txt
