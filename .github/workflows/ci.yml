name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-vs2022-x64

      - name: Build Release
        run: cmake --build --preset windows-vs2022-x64-release --parallel

      - name: Run tests
        run: ctest --preset windows-vs2022-x64-release

      - name: Build Debug
        run: cmake --build --preset windows-vs2022-x64-debug --parallel

      - name: Run Debug tests
        run: ctest --preset windows-vs2022-x64-debug

      - name: Run large archive stress validation
        timeout-minutes: 20
        shell: pwsh
        run: |
          $stressExecutable = Join-Path $env:GITHUB_WORKSPACE 'out/build/windows-vs2022-x64/Release/ComTraceArchiveStressTests.exe'
          & $stressExecutable --large
          if ($LASTEXITCODE -ne 0) {
            throw "Large archive stress validation failed with exit code $LASTEXITCODE."
          }

      - name: Verify release package contents
        shell: pwsh
        run: |
          $configurationDir = Join-Path $env:GITHUB_WORKSPACE 'out/build/windows-vs2022-x64/Release'
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'ComTracePackageCheck'
          $packageScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/package-release.ps1'
          & $packageScript -ConfigurationDirectory $configurationDir -ReleaseTag 'ci-validation' -OutputDirectory $outputDirectory
          if (-not (Test-Path (Join-Path $outputDirectory 'ComTrace-ci-validation-win-x64.zip'))) {
            throw "Release ZIP was not created."
          }
          if (-not (Test-Path (Join-Path $outputDirectory 'SHA256SUMS.txt'))) {
            throw "Release checksum file was not created."
          }
          if (-not (Test-Path (Join-Path $outputDirectory 'ComTraceOleActivityFixture.exe'))) {
            throw "OLE validation fixture was not copied as a release asset."
          }
          if (-not (Test-Path (Join-Path $configurationDir 'ComTraceLifetimeInstrumentation.lib'))) {
            throw "COM lifetime instrumentation library was not built."
          }
          if (-not (Test-Path (Join-Path $configurationDir 'ComTraceComLifetimeFixture.exe'))) {
            throw "COM lifetime fixture was not built."
          }
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'include/comtrace_lifetime.h'))) {
            throw "COM lifetime instrumentation header is missing."
          }
          $checksums = Get-Content (Join-Path $outputDirectory 'SHA256SUMS.txt') -Raw
          if ($checksums -notmatch 'ComTraceOleActivityFixture\.exe') {
            throw "OLE validation fixture checksum is missing."
          }

      - name: Check real trace validation script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/validate-real-trace.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "Real trace validation script contains syntax errors."
          }

      - name: Validate real COM and OLE ETL and CTRA round trip
        timeout-minutes: 15
        shell: pwsh
        run: |
          $comTrace = Join-Path $env:GITHUB_WORKSPACE 'out/build/windows-vs2022-x64/Release/ComTrace.exe'
          $comTraceArchive = Join-Path $env:GITHUB_WORKSPACE 'out/build/windows-vs2022-x64/Release/ComTraceArchive.exe'
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'ComTraceRealValidation'
          $validationScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/validate-real-trace.ps1'
          & $validationScript -ComTraceExe $comTrace -ComTraceArchiveExe $comTraceArchive -CaptureSeconds 30 -OutputDirectory $outputDirectory -AllowMissingOleEvents

      - name: Upload real COM and OLE validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comtrace-real-com-ole-validation
          path: ${{ runner.temp }}/ComTraceRealValidation
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect OLE provider schema
        if: always()
        shell: pwsh
        run: |
          $schema = & wevtutil.exe gp Microsoft-Windows-OLE-Perf /ge:true /gm:true /f:XML 2>&1
          if ($LASTEXITCODE -eq 0) {
            [xml]$manifest = ($schema | Out-String)
            $eventCount = $manifest.SelectNodes("//*[local-name()='event']").Count
            $templateCount = $manifest.SelectNodes("//*[local-name()='template']").Count
            $dataCount = $manifest.SelectNodes("//*[local-name()='data']").Count
            Write-Host "OLE manifest schema: events=$eventCount templates=$templateCount data_fields=$dataCount"
            $schema | Select-String -Pattern '<channel |<task |<event |<template |<data |<opcode |<keyword |OLE_|DataObject|Clipboard|DragDrop|IID|IPID|CLSID|GUID' -Context 0, 1
          } else {
            Write-Host "OLE-Perf provider schema is not available on this runner."
          }

      - name: Inspect COM Performance provider schema
        if: always()
        shell: pwsh
        run: |
          $schema = & wevtutil.exe gp Microsoft-Windows-COM-Perf /ge:true /gm:true /f:XML 2>&1
          if ($LASTEXITCODE -eq 0) {
            [xml]$manifest = ($schema | Out-String)
            $eventCount = $manifest.SelectNodes("//*[local-name()='event']").Count
            $templateCount = $manifest.SelectNodes("//*[local-name()='template']").Count
            $dataCount = $manifest.SelectNodes("//*[local-name()='data']").Count
            Write-Host "COM-Perf manifest schema: events=$eventCount templates=$templateCount data_fields=$dataCount"
            $schema | Select-String -Pattern '<event |<template |<data |ClassId|CLSID|TargetInterface|IPID|OID|CallTraceId|TargetProcessId|SourceProcessId|HRESULT' -Context 0, 1
          } else {
            Write-Host "COM-Perf provider schema is not available on this runner."
          }

